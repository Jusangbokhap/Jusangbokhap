name: Deploy to Amazon EKS

on:
  push:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: jusangbokhap
  EKS_CLUSTER_NAME: community-cluster
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:17
        ports: [ '5432:5432']
        env:
          POSTGRES_DB: jusangbokhap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:latest
        ports: [ '27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/classes
            build/generated
            ~/.sonar/cache
          key: ${{ runner.os }}-gradle-sonar-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-sonar-
            ${{ runner.os }}-gradle-
            ${{ runner.os }}-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}re
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build sonar --info

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        id: build_image
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          outputs: type=image,push=true

      - name: Set image output
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Update kube config
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name $EKS_CLUSTER_NAME

      - name: Create/Update k8s secrets
        run: |
          kubectl delete secret jusangbokhap-secret --ignore-not-found
          kubectl create secret generic jusangbokhap-secret --from-literal=REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} --from-literal=KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }} --from-literal=POSTGRES_URL=${{ secrets.POSTGRES_URL }} --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER }} --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} --from-literal=POSTGRES_DB=${{ secrets.POSTGRES_DB }} --from-literal=MONGO_PORT=${{ secrets.MONGO_PORT }} --from-literal=MONGO_USER=${{ secrets.MONGO_USER }} --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} --from-literal=MONGO_DB=${{ secrets.MONGO_DB }} --from-literal=MONGO_HOST=${{ secrets.MONGO_HOST }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Deploy to EKS
        run: |
          kubectl get secret elasticsearch-cert -n elasticsearch --ignore-not-found -o yaml | \
          sed 's/namespace: elasticsearch/namespace: default/' | \
          sed 's/resourceVersion: ".*"/resourceVersion: ""/' | \
          sed 's/uid: .*$/uid: ""/' | \
          kubectl apply -f -
          
          kubectl apply -f k8s/redis-deployment.yml
          
          sed -i "s|image:.*|image: ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.vars.outputs.sha_short }}|" k8s/deployment.yml
          kubectl apply -f k8s/

      - name: Deploy Monitoring Stack
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --set grafana.service.type=LoadBalancer \
            --set grafana.persistence.enabled=true \
            --set grafana.persistence.storageClassName=gp2 \
            --set grafana.persistence.size=10Gi \
            --set prometheus.prometheusSpec.retention=15d \
            --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=gp2 \
            --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=10Gi

      - name: Deploy ServiceMonitor
        run: |
          cat << EOF | kubectl apply -f -
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: jusangbokhap-monitor
            namespace: monitoring
            labels:
              release: prometheus
              app: jusangbokhap-app
          spec:
            jobLabel: jusangbokhap-app
            selector:
              matchLabels:
                app: jusangbokhap-app
            namespaceSelector:
              matchNames:
                - default
            endpoints:
            - port: http
              path: /actuator/prometheus
              interval: 15s
              scrapeTimeout: 10s
              honorLabels: true
              metricRelabelings:
                - sourceLabels: [__name__]
                  regex: 'jvm_.*'
                  action: keep
              relabelings:
                - sourceLabels: [__meta_kubernetes_pod_name]
                  targetLabel: pod
                - sourceLabels: [__meta_kubernetes_namespace]
                  targetLabel: namespace
                - sourceLabels: [__meta_kubernetes_service_name]
                  targetLabel: service
          EOF

      - name: Wait for Monitoring Stack
        run: |
          kubectl wait --for=condition=ready pod -l "app.kubernetes.io/instance=prometheus" -n monitoring --timeout=300s
          echo "Prometheus Stack is ready!"