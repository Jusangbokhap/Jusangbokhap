plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version "4.4.1.3373"
	id 'jacoco'
}

group = 'jsbh'
version = '0.0.1-SNAPSHOT'

jacoco {
	toolVersion = "0.8.9"
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
	}
	dependsOn test
}

test {
	finalizedBy jacocoTestReport
	jacoco {
		destinationFile = file("${buildDir}/jacoco/test.exec")
	}
}

sonarqube {
	properties {
		property "sonar.projectKey", "Jusangbokhap_Jusangbokhap"
		property "sonar.organization", "jusangbokhap"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.sourceEncoding", "UTF-8"
		property "sonar.java.source", "17"
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.0.0'
	set('springDocVersion',"2.8.3")
}

allprojects {
	tasks.withType(Test) {
		maxParallelForks = (Runtime.runtime.availableProcessors() / 2).intValue() ?: 1
		forkEvery = 100
		reports.html.required = false
	}
}

gradle.projectsEvaluated {
	tasks.withType(JavaCompile) {
		options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
		options.fork = true
		options.forkOptions.jvmArgs += ['-Xmx2048m']
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation "org.springframework.boot:spring-boot-starter-webflux"
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
	compileOnly 'org.projectlombok:lombok'

	// DB 관련
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'co.elastic.clients:elasticsearch-java:8.17.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	implementation 'io.netty:netty-resolver-dns-native-macos:4.1.96.Final'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation group: 'it.ozimov', name: 'embedded-redis', version: '0.7.2'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// QueryDSL 추가
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// API 문서화
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'

	// Prometheus 메트릭
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

test {
	useJUnitPlatform()
	maxParallelForks = (Runtime.runtime.availableProcessors() / 2).intValue() ?: 1
	jvmArgs = ['-Xmx2g', '-XX:MaxMetaspaceSize=512m']
	outputs.upToDateWhen { true }

	finalizedBy jacocoTestReport
	jacoco {
		destinationFile = file("${buildDir}/jacoco/test.exec")
	}

	reports {
		html.required = false
		junitXml.required = true
	}

	forkEvery = 100
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/annotationProcessor/java/main")
	options.fork = true
	options.incremental = true
}

// ✅ QueryDSL이 자동으로 빌드될 수 있도록 설정
sourceSets {
	main {
		java {
			srcDirs += "$buildDir/generated/sources/annotationProcessor/java/main"
		}
	}
}

tasks.register("cleanGenerated") {
	doLast {
		delete file("$buildDir/generated/sources/annotationProcessor/java/main")
	}
}

clean.dependsOn "cleanGenerated"
